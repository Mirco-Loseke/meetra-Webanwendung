<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Diagnose lokal</title>
<style>
    body { font: 14px system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #334155; padding: 6px 8px; text-align: left; vertical-align: top; }
    td.v { font-family: monospace; font-size: 12px; color: #94a3b8; word-break: break-all; }
    button { margin: 0 6px 12px 0; padding: 8px 14px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; cursor: pointer; }
    .gross { color: #f87171; font-weight: 700; }
</style>
</head>
<body>
<!-- Zeigt den localStorage, den die App per Doppelklick (file://) sieht.
     Per file:// teilen sich alle Seiten diesen Speicher. -->
<h2>localStorage unter file://</h2>
<p id="summe"></p>
<button onclick="location.reload()">Neu einlesen</button>
<button onclick="if (confirm('Alles außer der Anmeldung löschen?')) { Object.keys(localStorage).filter(k => !/^sb-/.test(k)).forEach(k => localStorage.removeItem(k)); location.reload(); }">Alles außer Anmeldung löschen</button>
<table><thead><tr><th>Schlüssel</th><th>Größe</th><th>Anfang</th><th></th></tr></thead><tbody id="liste"></tbody></table>
<script>
    var keys = Object.keys(localStorage).sort(function (a, b) { return localStorage.getItem(b).length - localStorage.getItem(a).length; });
    var gesamt = 0, html = '';
    keys.forEach(function (k) {
        var v = localStorage.getItem(k) || '';
        gesamt += v.length;
        var esc = function (s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
        html += '<tr><td>' + esc(k) + '</td><td class="' + (v.length > 100000 ? 'gross' : '') + '">' + (v.length / 1024).toFixed(1) + ' KB</td>'
            + '<td class="v">' + esc(/^sb-/.test(k) ? '(Anmeldung)' : v.slice(0, 120)) + '</td>'
            + '<td><button data-k="' + esc(k) + '">löschen</button></td></tr>';
    });
    document.getElementById('liste').innerHTML = html;
    document.getElementById('summe').textContent = keys.length + ' Einträge, zusammen ' + (gesamt / 1024).toFixed(0) + ' KB';
    document.getElementById('liste').addEventListener('click', function (e) {
        var k = e.target.getAttribute('data-k');
        if (k && confirm('„' + k + '“ löschen?')) { localStorage.removeItem(k); location.reload(); }
    });
</script>
</body>
</html>
