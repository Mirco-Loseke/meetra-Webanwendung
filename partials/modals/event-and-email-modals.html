    <!-- EREIGNIS MODAL -->
    <div id="ereignis-modal" class="modal-new hidden" style="z-index: 10000; display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);">
        <div class="modal-content glass-card" style="max-width: 780px; width: 94%; max-height: 92vh; overflow-y: auto; padding: 2.5rem; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 id="ereignis-modal-title" style="margin: 0; color: #fff; font-size: 1.8rem; font-weight: 800;">Neues Ereignis</h2>
                <button class="btn-close" onclick="window.closeCreateEventModal()" style="background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <form id="ereignis-form" onsubmit="window.saveEvent(event)">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label-caps">Titel</label>
                    <input type="text" id="event-title" class="glass-input" required placeholder="z.B. Kundentermin, Wartung geplant...">
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label-caps">Datum</label>
                        <input type="date" id="event-date" class="glass-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label-caps">Maschine</label>
                        <select id="event-machine-select" class="glass-input">
                            <option value="">Keine Maschine zugeordnet</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label-caps">Maschine manuell (optional)</label>
                    <input type="text" id="event-machine-manual" class="glass-input" placeholder="z.B. BACKHUS 17.55 – nicht im System angelegt">
                    <p style="color: rgba(255,255,255,0.35); font-size: 0.78rem; margin: 6px 2px 0;">Nur ausfüllen, wenn oben keine Maschine gewählt ist (z.B. für Maschinen, denen nur Teile geschickt wurden).</p>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label-caps">Wartungsart (optional, Mehrfachauswahl)</label>
                    <div id="event-wartungsart-group" style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <label class="event-wartungsart-chip" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 14px; cursor: pointer; color: #fff; font-size: 0.9rem; font-weight: 600;"><input type="checkbox" class="event-wartungsart" value="UVV" style="width: 17px; height: 17px; cursor: pointer;"> UVV</label>
                        <label class="event-wartungsart-chip" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 14px; cursor: pointer; color: #fff; font-size: 0.9rem; font-weight: 600;"><input type="checkbox" class="event-wartungsart" value="SBA-Wartung" style="width: 17px; height: 17px; cursor: pointer;"> SBA-Wartung</label>
                        <label class="event-wartungsart-chip" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 14px; cursor: pointer; color: #fff; font-size: 0.9rem; font-weight: 600;"><input type="checkbox" class="event-wartungsart" value="Motorwartung" style="width: 17px; height: 17px; cursor: pointer;"> Motorwartung</label>
                        <label class="event-wartungsart-chip" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 9px 14px; cursor: pointer; color: #fff; font-size: 0.9rem; font-weight: 600;"><input type="checkbox" class="event-wartungsart" value="Hydraulikwartung" style="width: 17px; height: 17px; cursor: pointer;"> Hydraulikwartung</label>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label class="form-label-caps">Beschreibung</label>
                    <textarea id="event-description" class="glass-input" style="height: 100px; resize: none; padding-top: 15px;" placeholder="Optionale Details..."></textarea>
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <button type="button" class="btn-secondary" onclick="window.closeCreateEventModal()" style="flex: 1; height: 55px; font-weight: 700;">Abbrechen</button>
                    <button type="submit" class="btn-primary btn-red-animated" style="flex: 1; height: 55px; font-weight: 800;">EREIGNIS SPEICHERN</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EMAIL IMPORT MODAL -->
    <div id="email-import-modal" class="modal-new hidden" style="z-index: 10000; display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);">
        <div class="modal-content glass-card proc-modal-scroll" style="max-width: 750px; width: 90%; max-height: 90vh; overflow-y: auto !important; padding: 2rem; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h2 style="margin: 0; color: #fff; font-size: 1.8rem; font-weight: 800;">E-Mail / Vorgang importieren</h2>
                <button class="btn-close" onclick="window.closeEmailImportModal()" style="background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="form-group" style="margin-bottom: 0.75rem;">
                <label class="form-label-caps">Outlook-E-Mail (.msg) importieren</label>
                <div id="email-msg-dropzone"
                    onclick="document.getElementById('email-msg-file-input').click()"
                    ondragover="event.preventDefault(); this.style.borderColor='var(--color-primary-green)'; this.style.background='rgba(52,211,153,0.06)';"
                    ondragleave="this.style.borderColor='rgba(255,255,255,0.15)'; this.style.background='transparent';"
                    ondrop="window.handleMsgFileDrop(event)"
                    style="border: 2px dashed rgba(255,255,255,0.15); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; color: rgba(255,255,255,0.45); font-size: 0.95rem; font-weight: 600; transition: border-color 0.2s, background 0.2s;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: 0 auto 10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    .msg-Datei hierher ziehen oder klicken
                </div>
                <input type="file" id="email-msg-file-input" accept=".msg" style="display:none;" onchange="window.handleMsgFileSelect(event)">
            </div>

            <form id="email-import-form" onsubmit="window.saveImportedEmail(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0.75rem;">
                    <div class="form-group">
                        <label class="form-label-caps">Vorgangs-Typ</label>
                        <div style="position:relative;">
                            <select id="email-type-select" style="display:none;">
                                <option value="email_incoming">E-Mail Eingang</option>
                                <option value="email_outgoing">E-Mail Ausgang</option>
                                <option value="note">Interne Notiz</option>
                                <option value="call">Telefonat</option>
                                <option value="appointment">Termin / Besuch</option>
                                <option value="repair">Reparatur</option>
                                <option value="maintenance">Wartung</option>
                                <option value="offer">Angebot</option>
                                <option value="order">Bestellung</option>
                                <option value="complaint">Reklamation</option>
                                <option value="other">Sonstiges</option>
                                <option value="manual">Manuell</option>
                            </select>
                            <div id="email-type-select-trigger" class="glass-select" style="cursor:pointer; display:flex; align-items:center; gap:8px;" onclick="window.toggleProcessSelectDropdown('email','type')">
                                <span id="email-type-select-dot" style="flex-shrink:0; width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.3);"></span>
                                <span id="email-type-select-text" style="flex:1;">E-Mail Eingang</span>
                            </div>
                            <div id="email-type-menu" class="proc-select-menu user-dropdown-menu" style="width:100%; top:105%; right:auto; left:0;"><ul></ul></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label-caps">Datum / Uhrzeit</label>
                        <input type="datetime-local" id="email-date-input" class="glass-input" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label class="form-label-caps">Betreff / Titel</label>
                    <input type="text" id="email-title-input" class="glass-input" required placeholder="Betreff der E-Mail...">
                </div>

                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label class="form-label-caps">Bemerkung / Beschreibung</label>
                    <textarea id="email-remark-input" class="glass-input" style="height: 80px; resize: vertical; padding-top: 15px;" placeholder="Interne Bemerkung..."></textarea>
                </div>

                <div class="form-group" id="email-body-group" style="margin-bottom: 0.75rem; display: none;">
                    <label class="form-label-caps">E-Mail-Text</label>
                    <textarea id="email-body-input" class="glass-input" style="height: 100px; resize: vertical; padding-top: 15px;" placeholder="Textinhalt der E-Mail..."></textarea>
                </div>

                <div id="email-sender-recipient-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0.75rem;">
                    <div class="form-group" style="position: relative;">
                        <label class="form-label-caps">Absender (Von)</label>
                        <input type="text" id="email-sender-input" class="glass-input" placeholder="Name oder E-Mail...">
                        <div id="email-sender-suggestions" class="autocomplete-suggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; max-height: 200px; overflow-y: auto; margin-top: 4px;"></div>
                    </div>
                    <div class="form-group" style="position: relative;">
                        <label class="form-label-caps">Empfänger (An)</label>
                        <input type="text" id="email-recipient-input" class="glass-input" placeholder="Name oder E-Mail...">
                        <div id="email-recipient-suggestions" class="autocomplete-suggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; max-height: 200px; overflow-y: auto; margin-top: 4px;"></div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; margin-bottom: 0.75rem;">
                    <div class="form-group" style="position: relative;">
                        <label class="form-label-caps">Maschine / Werkstattauftrag</label>
                        <input type="hidden" id="email-machine-select" value="">
                        <input type="hidden" id="email-workshop-order-select" value="">
                        <input type="text" id="email-machine-search" class="glass-input" placeholder="Maschine suchen..." autocomplete="off"
                            oninput="window.filterProcessMachineDropdown('email', this.value)"
                            onfocus="window.showProcessMachineDropdown('email')">
                    </div>
                    <div class="form-group">
                        <label class="form-label-caps">Vorgangs-Status</label>
                        <div style="position:relative;">
                            <select id="email-status-select" style="display:none;">
                                <option value="offen">Offen</option>
                                <option value="in_bearbeitung">In Bearbeitung</option>
                                <option value="erledigt">Erledigt</option>
                            </select>
                            <div id="email-status-select-trigger" class="glass-select" style="cursor:pointer; display:flex; align-items:center; gap:8px;" onclick="window.toggleProcessSelectDropdown('email','status')">
                                <span id="email-status-select-dot" style="flex-shrink:0; width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.3);"></span>
                                <span id="email-status-select-text" style="flex:1;">Offen</span>
                            </div>
                            <div id="email-status-menu" class="proc-select-menu user-dropdown-menu" style="width:100%; top:105%; right:auto; left:0;"><ul></ul></div>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label-caps">Mitarbeiter zuweisen</label>
                    <div id="email-tech-dropdown-wrapper" style="position: relative; z-index: 3000;">
                        <div id="email-tech-dropdown-trigger" onclick="window.toggleProcessTechDropdown('email')"
                            style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 48px; padding: 8px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; cursor: pointer; transition: border-color 0.2s; user-select: none;">
                            <div id="email-tech-selected-pills" style="display: flex; flex-wrap: wrap; gap: 6px; flex: 1;"></div>
                            <div id="email-tech-placeholder-text" style="display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.4); font-size: 0.88rem; margin-left: auto;">Mitarbeiter wählen...</div>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div id="email-tech-dropdown-panel" class="tech-dropdown-panel"
                            style="display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: rgba(15,23,42,0.97); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; z-index: 200; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); max-height: 240px; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,0.5);">
                            <div id="email-tech-option-list" style="padding: 8px;"></div>
                        </div>
                    </div>
                    <input type="hidden" id="email-assigned-users">
                </div>

                <div style="display: flex; gap: 15px;">
                    <button type="button" class="btn-secondary" onclick="window.closeEmailImportModal()" style="flex: 1; height: 44px; font-size: 0.92rem; font-weight: 700;">Abbrechen</button>
                    <button type="submit" class="btn-primary btn-red-animated" style="flex: 1; height: 44px; font-size: 0.92rem; font-weight: 800;">VORGANG SPEICHERN</button>
                </div>
            </form>
        </div>
    </div>
