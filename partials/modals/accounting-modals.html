<div id="split-item-modal" class="modal-backdrop hidden">
    <div class="modal-content" style="max-width: 850px; padding: 28px; border-radius: 20px; margin: auto;">
        <div
            style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
            <div>
                <h2 style="margin: 0; font-size: 1.3rem; display: flex; align-items: center; gap: 10px;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="var(--color-primary-green)" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="3" x2="12" y2="8" />
                        <path d="M12 8 L5 21" />
                        <path d="M12 8 L19 21" />
                        <circle cx="12" cy="3" r="1.5" fill="var(--color-primary-green)" />
                    </svg>
                    Position aufteilen
                </h2>
                <div id="split-item-info"
                    style="font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-top: 6px;"></div>
            </div>
            <button onclick="window.closeSplitDialog()" class="btn-icon-soft"
                style="color:#ef4444; padding:5px; flex-shrink:0;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>

        <!-- Validation bar -->
        <div
            style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;">
            <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem; font-weight: 600;">Gesamt:</span>
            <span id="split-total-display" style="font-weight: 800; font-size: 1rem; color: #fff;"></span>
            <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">Verteilt:</span>
            <span id="split-distributed-display"
                style="font-weight: 800; font-size: 1rem; color: var(--color-primary-green);">0</span>
            <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">Rest:</span>
            <span id="split-remaining-display"
                style="font-weight: 800; font-size: 1rem; color: #f87171;">0</span>
        </div>

        <!-- Split rows -->
        <div id="split-rows"
            style="display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; margin-bottom: 16px;">
        </div>

        <!-- Add row -->
        <button onclick="window.addSplitRow()"
            style="width: 100%; padding: 10px; background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px; color: rgba(255,255,255,0.4); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;"
            onmouseover="this.style.background='rgba(255,255,255,0.08)'; this.style.color='#fff';"
            onmouseout="this.style.background='rgba(255,255,255,0.04)'; this.style.color='rgba(255,255,255,0.4)';">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Weitere Aufteilung hinzufügen
        </button>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
            <button onclick="window.closeSplitDialog()" class="btn-secondary"
               >Abbrechen</button>
            <button onclick="window.submitSplit()" id="split-confirm-btn" class="btn-primary"
                style="opacity: 0.5; cursor: not-allowed;">Aufteilen bestätigen</button>
        </div>
    </div>
</div>

<!-- Accounting Modal -->
<div id="accounting-modal" class="modal-backdrop hidden">
    <link rel="stylesheet" href="css/views/accounting-modal.css?v=2">
    <div class="modal-content"
        style="max-width: 850px; position: relative; padding: 30px; border-radius: 20px; height: auto; margin: auto;">
        <div class="modal-header"
            style="background: transparent; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px;">
            <h2 id="accounting-modal-title" style="margin: 0; padding-right: 40px; font-size: 1.4rem;">Neuer
                Buchhaltungseintrag</h2>

            <button type="button" onclick="closeAccountingModal()" class="modal-close-btn"
                style="position: absolute !important; top: 16px !important; right: 16px !important; width: 32px !important; display: flex !important; align-items: center !important; justify-content: center !important; z-index: 100 !important; cursor: pointer !important;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div id="acc-upload-feld" style="margin-bottom: 1rem;"></div>
        <!-- Statusbox: js/accounting.js zeigt hier den Fortschritt der Texterkennung -->
        <div id="acc-pdf-dropzone" style="margin-bottom: 1.5rem;"></div>

        <!-- Ergebnis-/Warnbanner der KI-Analyse (wird per JS befüllt, ersetzt die window.showToast()-Popups) -->
        <div id="acc-ai-result-banner" class="hidden"
            style="margin: -0.75rem 0 1.5rem 0; padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; display: none;">
        </div>

        <form id="accounting-form" onsubmit="submitAccountingEntry(event)">
            <input type="hidden" id="accounting-id">
            <input type="hidden" id="acc-document-url">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem;">
                <div class="form-group">
                    <label for="acc-type">Typ</label>
                    <select id="acc-type" class="glass-form-input" data-no-enhance required
                        onchange="updateAccountingEntityLabel()">
                        <option value="incoming">Eingangsrechnung</option>
                        <option value="outgoing">Ausgangsrechnung</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="acc-invoice-number">Rechnungsnummer</label>
                    <input type="text" id="acc-invoice-number" class="glass-form-input"
                        placeholder="z.B. RE-2024-001">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem;">
                <div class="form-group">
                    <label for="acc-date">Datum</label>
                    <input type="date" id="acc-date" class="glass-form-input" required>
                </div>
                <div class="form-group">
                    <label id="acc-entity-label" for="acc-entity">Lieferant</label>
                    <input type="text" id="acc-entity" class="glass-form-input" required
                        placeholder="Name des Unternehmens">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                <div class="form-group">
                    <label for="acc-due-date">Fällig am (z.B. "sofort")</label>
                    <input type="text" id="acc-due-date" class="glass-form-input"
                        placeholder="YYYY-MM-DD oder sofort">
                </div>
                <div class="form-group">
                    <label for="acc-discount-date">Skonto bis (Optional)</label>
                    <input type="date" id="acc-discount-date" class="glass-form-input">
                </div>
                <div class="form-group">
                    <label for="acc-discount-amount">Skonto-Betrag (€)</label>
                    <input type="number" step="0.01" id="acc-discount-amount" class="glass-form-input"
                        placeholder="0.00">
                </div>
            </div>

            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1.5rem; margin-top: 1.25rem; background: rgba(255,255,255,0.03); padding: 1.25rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); align-items: end;">
                <div class="form-group">
                    <label for="acc-amount-net">Summe Netto (€)</label>
                    <input type="number" step="0.01" id="acc-amount-net" class="glass-form-input" required
                        oninput="calculateGross()">
                </div>
                <div class="form-group">
                    <label for="acc-vat-rate">MwSt. Satz (%)</label>
                    <select id="acc-vat-rate" class="glass-form-input" data-no-enhance onchange="calculateGross()">
                        <option value="19">19%</option>
                        <option value="7">7%</option>
                        <option value="0">0%</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="acc-amount-gross">Summe Brutto (€)</label>
                    <input type="number" step="0.01" id="acc-amount-gross" class="glass-form-input" required>
                </div>
                <div class="form-group"
                    style="display: flex; align-items: center; gap: 12px; height: 36px; padding-bottom: 2px;">
                    <label
                        style="position: relative; display: inline-block; width: 44px; height: 24px; margin: 0; cursor: pointer;">
                        <input type="checkbox" id="acc-is-paid"
                            style="opacity: 0; width: 0; height: 0; position: absolute;">
                        <span
                            style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); transition: .3s; border-radius: 24px;"
                            class="toggle-slider">
                            <span
                                style="position: absolute; height: 18px; width: 18px; left: 3px; bottom: 2px; background-color: rgba(255,255,255,0.5); transition: .3s; border-radius: 50%;"
                                class="toggle-circle"></span>
                        </span>
                    </label>
                    <span
                        style="font-size: 0.95rem; color: #fff; font-weight: 700; letter-spacing: 0.5px;">Bezahlt</span>
                </div>
                <div class="form-group">
                    <label for="acc-paid-at">Bezahlt am</label>
                    <input type="date" id="acc-paid-at" class="glass-form-input">
                </div>
                <!-- Konto abgebucht toggle -->
                <div class="form-group"
                    style="display: flex; align-items: center; gap: 12px; height: 36px; padding-bottom: 2px;">
                    <label
                        style="position: relative; display: inline-block; width: 44px; height: 24px; margin: 0; cursor: pointer;">
                        <input type="checkbox" id="acc-is-debited"
                            style="opacity: 0; width: 0; height: 0; position: absolute;">
                        <span
                            style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); transition: .3s; border-radius: 24px;"
                            class="toggle-slider-debited">
                            <span
                                style="position: absolute; height: 18px; width: 18px; left: 3px; bottom: 2px; background-color: rgba(255,255,255,0.5); transition: .3s; border-radius: 50%;"
                                class="toggle-circle-debited"></span>
                        </span>
                    </label>
                    <span
                        style="font-size: 0.95rem; color: #f87171; font-weight: 700; letter-spacing: 0.5px;">Konto
                        abgebucht</span>
                </div>
            </div>

            <!-- Global Assignment Row -->
            <div id="acc-global-assignment-box"
                style="margin-top: 1rem; background: rgba(255,255,255,0.03); padding: 1.25rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                <div
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.4); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px;">
                    Zuordnung Gesamte Rechnung
                </div>
                <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                    <!-- Type Toggle -->
                    <div
                        style="display: flex; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);">
                        <button type="button" id="acc-global-type-machine"
                            onclick="window.toggleGlobalAssignmentType('machine')"
                            style="padding: 6px 14px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; background: var(--color-primary-green); color: white;">
                            Maschine
                        </button>
                        <button type="button" id="acc-global-type-other"
                            onclick="window.toggleGlobalAssignmentType('other')"
                            style="padding: 6px 14px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; background: transparent; color: rgba(255,255,255,0.4);">
                            Andere
                        </button>
                    </div>
                    <!-- Machine Filter + Search -->
                    <div id="acc-global-machine-ui"
                        style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
                        <div
                            style="display: flex; background: rgba(255,255,255,0.05); padding: 3px; border-radius: 8px;">
                            <button type="button" id="acc-global-filter-all"
                                onclick="window.toggleGlobalMachineFilter('all')"
                                style="padding: 4px 10px; border-radius: 6px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.1); color: white;">Alle</button>
                            <button type="button" id="acc-global-filter-workshop"
                                onclick="window.toggleGlobalMachineFilter('workshop')"
                                style="padding: 4px 10px; border-radius: 6px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; background: transparent; color: rgba(255,255,255,0.4);">Werkstatt</button>
                        </div>
                        <div id="acc-global-machine-search-wrapper"
                            style="position: relative; flex: 1; min-width: 0;">
                            <svg style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3);"
                                width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="acc-global-machine-search" class="glass-form-input"
                                placeholder="Maschine suchen..."
                                oninput="window.filterGlobalMachineDropdown(this.value)"
                                onfocus="window.filterGlobalMachineDropdown(this.value)"
                                style="padding: 0 12px 0 32px; font-size: 0.85rem; height: 38px; border-color: rgba(255,255,255,0.1);">
                            <input type="hidden" id="acc-global-machine-id">
                        </div>
                        <div id="acc-global-workshop-dropdown" style="display: none; flex: 1; min-width: 0;">
                            <select id="acc-global-workshop-machine" class="glass-form-input centered-select"
                                style="height: 38px; font-size: 0.85rem;"
                                onchange="window.selectGlobalWorkshopMachine(this.value)">
                                <option value="">-- Werkstatt-Maschine wählen --</option>
                            </select>
                        </div>
                    </div>
                    <!-- Other Area Select (feste Bereiche aus Einstellungen > Kategorien > Buchhaltungs-Bereiche) -->
                    <div id="acc-global-other-ui" style="display: none; flex: 1; min-width: 0;">
                        <select id="acc-global-assignment-area" class="glass-form-input" data-no-enhance
                            style="height: 38px; font-size: 0.85rem;"
                            onchange="window.applyGlobalAssignmentToItemRows()">
                            <option value="">Bereich wählen...</option>
                        </select>
                    </div>
                    <!-- Apply to all checkbox -->
                    <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                        <input type="checkbox" id="acc-global-apply-to-items" checked
                            style="width: 16px; height: 16px; accent-color: var(--color-primary-green); cursor: pointer;"
                            onchange="if (this.checked) window.applyGlobalAssignmentToItemRows();">
                        <label for="acc-global-apply-to-items"
                            style="font-size: 0.8rem; color: rgba(255,255,255,0.5); font-weight: 600; cursor: pointer;">Auf
                            alle Positionen übertragen</label>
                    </div>
                </div>
            </div>

            <link rel="stylesheet" href="css/views/accounting-toggle.css?v=2">

            <!-- Individual Positions Section -->
            <div style="margin-top: 1.25rem;">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3
                        style="margin: 0; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 8px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        Einzelne Positionen
                    </h3>
                    <button type="button" class="btn-secondary compact knopf--klein" onclick="window.addAccountingItemRow()"
                       >
                        + Position hinzufügen
                    </button>
                </div>
                <div id="accounting-items-container"
                    style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
                    <!-- Item rows added dynamically -->
                </div>
            </div>


            <div
                style="margin-top: 3rem; display: flex; justify-content: flex-end; gap: 12px; padding-bottom: 10px;">
                <button type="button" class="btn-secondary" onclick="closeAccountingModal()">Abbrechen</button>
                <button type="submit" class="btn-primary">Speichern</button>
            </div>
        </form>
    </div>
</div>

<!-- Financial Dashboard Modal -->
<div id="financial-dashboard-modal" class="modal-backdrop hidden">
    <div class="modal-content"
        style="max-width: 1100px; max-height: 85vh; display: flex; flex-direction: column;">
        <div class="modal-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0;">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 12px; font-size: 1.5rem;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                    <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                </svg>
                Finanzübersicht
                <span id="fin-today-date"
                    style="font-size: 1rem; color: rgba(255,255,255,0.4); font-weight: 400; margin-left: 10px;"></span>
            </h2>
            <div style="display: flex; align-items: center; gap: 10px;">
                <select id="fin-direction" class="glass-form-input"
                    style="padding: 5px 12px; width: 130px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.85rem; border-radius: 10px;"
                    onchange="window.updateFinancialDashboard()">
                    <option value="future" selected>Zukünftig</option>
                    <option value="past">Vergangen</option>
                    <option value="all">Gesamt</option>
                </select>
                <div id="fin-days-wrapper"
                    style="display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);">
                    <input type="number" id="fin-days" value="14" min="1" max="365"
                        style="padding: 0; width: 35px; border: none; background: transparent; text-align: center; font-size: 0.85rem; color: #fff; font-weight: 700;"
                        oninput="window.updateFinancialDashboard()">
                    <span style="font-size: 0.8rem; color: rgba(255,255,255,0.4); font-weight: 600;">Tage</span>
                </div>
                <button onclick="window.closeFinancialDashboard()" class="btn-icon-soft"
                    style="color: #ef4444; padding: 5px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="3">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div id="fin-type-tabs" style="display: flex; gap: 6px; margin-bottom: 14px; flex-shrink: 0;">
            <button class="fin-type-tab active" data-type="all"
                onclick="window.switchFinType('all')">Gesamt</button>
            <button class="fin-type-tab" data-type="incoming"
                onclick="window.switchFinType('incoming')">Eingang</button>
            <button class="fin-type-tab" data-type="outgoing"
                onclick="window.switchFinType('outgoing')">Ausgang</button>
        </div>

        <div id="financial-dashboard-content" style="overflow-y: auto; flex-grow: 1; padding-right: 5px;">
            <!-- Dynamic Content via JS -->
        </div>
    </div>
</div>
