<div id="document-overview-modal" class="modal-backdrop hidden"
    style="z-index: 1100; display: none; align-items: center; justify-content: center;">
    <div class="modal-content glass-card"
        style="max-width: 500px; padding: 2rem; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 24px 64px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div
                    style="width: 40px; height: 40px; border-radius: 10px; background: rgba(59,130,246,0.1); display: flex; align-items: center; justify-content: center; color: #60a5fa;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                </div>
                <h2 style="margin: 0; font-size: 1.4rem; color: white;">Dokumente</h2>
            </div>
            <button class="btn-close-modal" onclick="window.closeDocumentsModal()">&times;</button>
        </div>
        <div id="document-overview-list"
            style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
            <!-- List of docs -->
        </div>
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
            <button class="btn-secondary" onclick="window.closeDocumentsModal()">Schließen</button>
        </div>
    </div>
</div>
