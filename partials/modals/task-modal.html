<div id="task-modal" class="modal-backdrop hidden">
    <div class="modal-content glass-card"
        style="max-width: 900px; position: relative; background: rgba(10,15,30,0.97); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); padding-top: 1.25rem;">
        <div class="modal-header" style="margin-bottom: 0.5rem; display: flex; justify-content: flex-start; align-items: flex-start;">
            <h2 id="task-modal-title" style="margin: 0; font-size: 1.3rem;">Aufgabe bearbeiten</h2>
            <button class="btn-close-modal task-modal-close" onclick="closeTaskModal()" style="margin: -0.75rem -0.25rem 0 auto;">&times;</button>
        </div>
        <div class="modal-body">
            <!-- Optimized Multi-column grid -->
            <div style="display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start;">
                <!-- Row 1: Maschine (Prio 1) -->
                <div class="form-group" style="margin-bottom: 0; position: relative;">
                    <label style="color: var(--color-primary-green); font-size: 1.1rem; font-weight: 800;">1. Maschine wählen</label>
                    <input type="hidden" id="task-machine">
                    <input type="text" id="task-machine-search" class="glass-input" placeholder="Nach Maschine suchen..."
                        autocomplete="off" oninput="filterMachineDropdown(this.value)"
                        onfocus="showMachineDropdown()"
                        style="color: var(--color-primary-green); font-weight: 700; font-size: 1.2rem; height: 60px; padding-left: 20px;">
                    <div id="task-machine-dropdown" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:9999;
                                    background: rgba(15,23,42,0.98); border:1px solid rgba(255,255,255,0.12);
                                    border-radius:12px; max-height:250px; overflow-y:auto; margin-top:4px;
                                    box-shadow: 0 12px 40px rgba(0,0,0,0.6);">
                    </div>

                    <!-- Werkstattauftrag ohne Maschinenbezug -->
                    <div id="task-workshop-order-wrapper" style="display:none; margin-top: 12px;">
                        <label style="color: #60a5fa; font-weight: 800; display: block; margin-bottom: 6px;">Werkstattauftragsnummer</label>
                        <div class="glass-form-input" style="display: flex; align-items: center; gap: 4px; padding: 0.5rem 1rem; border-radius: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); width: 100%; box-sizing: border-box;">
                            <span style="color: white; font-weight: 600; font-size: 1.1rem; user-select: none;">202</span>
                            <input type="text" id="task-workshop-year-digit" maxlength="1" style="background: transparent; border: none; outline: none; color: white; font-size: 1.1rem; font-weight: 600; width: 15px; padding: 0; text-align: center;" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                            <span style="color: white; font-weight: 600; font-size: 1.1rem; user-select: none;">-40</span>
                            <input type="text" id="task-workshop-order-suffix" placeholder="000" maxlength="3" style="background: transparent; border: none; outline: none; color: white; font-size: 1.1rem; font-weight: 600; width: 100%; padding: 0;" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        </div>
                    </div>
                </div>

                <!-- Row 2: Title & Vorlagen -->
                <div id="task-details-section" style="display: none; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label>Aufgabentitel</label>
                        <input type="text" id="task-title" class="glass-input" placeholder="Titel der Aufgabe"
                            style="font-size: 1.1rem; font-weight: 700;">
                    </div>

                    <!-- Zuständig Row -->
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label>Zuständig</label>
                        <div class="custom-filter-dropdown" id="task-user-select-trigger"
                            style="width: 100%; min-height: 50px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;">
                            <div id="task-assigned-users-label"
                                style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                <span style="color: rgba(255,255,255,0.4);">Niemand zugewiesen</span>
                            </div>
                            <svg class="filter-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                style="opacity: 0.5;">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            <div class="custom-filter-menu" id="task-user-select-menu"
                                style="width: 100%; max-height: 200px; overflow-y: auto;">
                                <ul id="task-user-options">
                                    <!-- Dynamically populated -->
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Zeitraum: dieselben Spalten, die auch die Timeline schreibt
                         (tasks.start_date / tasks.end_date). Leer lassen heisst
                         „ungeplant" — die Aufgabe steht dann in der Timeline-Leiste. -->
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label>Zeitraum</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div>
                                <span class="form-label-caps">Start</span>
                                <input type="date" id="task-start-date" class="glass-input">
                            </div>
                            <div>
                                <span class="form-label-caps">Ende</span>
                                <input type="date" id="task-end-date" class="glass-input">
                            </div>
                        </div>
                    </div>

                    <!-- Supergroups Section -->
                    <div id="supergroups-container" style="margin-top: 30px;">
                        <div id="quick-template-picker-container" style="margin-bottom: 25px;">
                            <!-- Dynamically populated from task_templates.js -->
                        </div>
                        <h3 class="section-title" style="color: #fff; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 2px solid var(--primary-red); padding-bottom: 5px; display: inline-block;">Übergruppen & Unteraufgaben</h3>
                        <div id="task-supergroups-list" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px;">
                            <!-- Dynamically populated groups -->
                        </div>
                        <button class="btn-secondary compact" style="width: 100%; border-style: dashed;" onclick="window.addNewSupergroupToTask()">
                            + NEUE ÜBERGRUPPE HINZUFÜGEN
                        </button>
                    </div>

                    <!-- Beschreibung: optionales, automatisch wachsendes Feld -->
                    <div class="form-group" style="margin-top: 20px; margin-bottom: 0;">
                        <label>Beschreibung (optional)</label>
                        <textarea id="task-description" class="glass-input" rows="1"
                            placeholder="Details zur Aufgabe..."
                            style="line-height: 1.5; resize: none; overflow: hidden; min-height: 44px;"
                            oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-actions" style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 12px;">
            <button class="btn-modal-base btn-modal-cancel" onclick="closeTaskModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Abbrechen
            </button>
            <button class="btn-modal-base btn-modal-save" onclick="saveTask()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Speichern
            </button>
        </div>
    </div>
</div>
