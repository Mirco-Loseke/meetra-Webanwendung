<!-- Filter-Katalog (js/maschinen-filter.js, css/views/filter.css, Tabelle machine_filters) -->
<section id="settings-filter" class="view hidden">
    <div class="users-header-container">
        <h1>Filter</h1>
        <div class="users-header-actions">
            <button type="button" class="knopf knopf--primaer" data-mf-neu>Neuer Filter</button>
            <button class="btn-back-custom" data-target="settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                ZURÜCK
            </button>
        </div>
    </div>
    <p class="mf-hinweis">Pro Filter: OEM- und Alternativnummern, Wechselintervall und wofür er passt. Zugeordnet wird vor allem über den <b>Motortyp</b> der Maschine; Hersteller und Maschinentyp schränken optional zusätzlich ein. Angezeigt in der Maschine unter dem Reiter „Filter“.</p>
    <div class="glass-card mf-karte-seite">
        <div id="mf-foto-zone"></div>
        <div class="mf-kopfzeile">
            <input type="search" id="mf-suche" class="glass-form-input" placeholder="Suchen: Bezeichnung, Nummer, Motor …" autocomplete="off">
            <div class="mz-filter" role="group" aria-label="Ansicht">
                <button type="button" class="mz-filter-chip" data-mf-ansicht="motor">Nach Motor</button>
                <button type="button" class="mz-filter-chip" data-mf-ansicht="liste">Alle (Liste)</button>
            </div>
        </div>
        <div id="mf-import" hidden></div>
        <div id="mf-form" hidden></div>
        <div id="mf-liste" class="mf-tabelle"></div>
    </div>
</section>
