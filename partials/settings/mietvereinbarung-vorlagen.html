<!-- MIETVEREINBARUNG (4/4) — beide Sektionen loeschen = weg -->
<section id="miet-vorlagen" class="view hidden">
    <div class="users-header-container">
        <h1>Mietvereinbarungen</h1>
        <div class="users-header-actions">
            <button class="btn-primary" onclick="window.mietVorlageNeu()" style="margin-right: 0.75rem;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                ANLEGEN
            </button>
            <button class="btn-back-custom" data-target="settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                ZURÜCK
            </button>
        </div>
    </div>
    <p style="color: rgba(255,255,255,0.45); font-size: 0.9rem; margin-top: 1rem;">
        Jede Vorlage legt einen eigenen Bogen fest — Beschriftungen, Prüfspalten, Baugruppen,
        Fotopositionen und Vertragstext. Über den Maschinentyp wird sie automatisch gezogen,
        wenn an einer solchen Maschine eine Mietvereinbarung angelegt wird.
    </p>
    <div id="miet-vorlagen-liste" class="card-grid" style="margin-top: 1.5rem;">
        <div class="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: rgba(255,255,255,0.4);">
            Lade Vorlagen …
        </div>
    </div>
</section>

<section id="miet-vorlage-editor" class="view hidden">
    <div class="users-header-container">
        <h1 id="miet-vorlage-titel">Vorlage bearbeiten</h1>
        <div class="users-header-actions" style="display: flex; align-items: center; gap: 0.75rem;">
            <button class="btn-back-custom" data-target="miet-vorlagen">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                ZURÜCK
            </button>
            <button class="btn-secondary" onclick="window.mietVorlageZuruecksetzen()">Standard laden</button>
            <button class="btn-secondary" onclick="window.mietVorlageVorschau()">Vorschau</button>
            <button class="btn-primary" onclick="window.mietVorlageSpeichern()">SPEICHERN</button>
        </div>
    </div>
    <div id="miet-vorlage-editor-inhalt" style="margin-top: 2rem;"></div>
</section>
