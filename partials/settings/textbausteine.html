        <!-- Textbausteine Settings View -->
        <section id="settings-textbausteine" class="view hidden">
            <div class="users-header-container">
                <h1>Textbausteine verwalten</h1>
                <div class="users-header-actions">
                    <button class="btn-back-custom" data-target="settings">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5"></path>
                            <path d="M12 19l-7-7 7-7"></path>
                        </svg>
                        ZURÜCK
                    </button>
                </div>
            </div>

            <div class="settings-tabs-container" style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                <div class="settings-tabs" style="display: flex; gap: 20px; overflow-x: auto; padding-bottom: 0; border-bottom: none; margin: 0;">
                    <button class="settings-tab active" data-tab="supergroups" onclick="switchTextSnippetTab('supergroups')">Übergruppen</button>
                    <button class="settings-tab" data-tab="subtasks" onclick="switchTextSnippetTab('subtasks')">Unteraufgaben</button>
                    <button class="settings-tab" data-tab="quicktemplates" onclick="switchTextSnippetTab('quicktemplates')">Schnellvorlagen</button>
                </div>
                <button id="btn-create-qt" class="btn-primary" onclick="window.resetQTBuilder(); window.openQTModal();" style="display: none; align-items: center; gap: 8px; padding: 10px 20px; font-weight: 500; font-size: 0.9rem; border-radius: 12px; text-transform: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Schnellvorlage erstellen
                </button>
            </div>

            <div id="supergroups-tab-content" class="tab-content active">
                <div class="glass-card" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; color: #fff;">Standard-Übergruppen</h3>
                    <div id="supergroup-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem;">
                        <!-- List of supergroups -->
                    </div>
                    <div style="display: flex; gap: 10px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                        <input type="text" id="new-supergroup-name" class="glass-input" placeholder="Neue Übergruppe (z.B. Wartung)" style="height: 50px;">
                        <button class="btn-primary compact" style="height: 50px; padding: 0 25px;" onclick="addSupergroupTemplate()">Hinzufügen</button>
                    </div>
                </div>
            </div>

            <div id="subtasks-tab-content" class="tab-content hidden">
                <div class="glass-card" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; color: #fff;">Unteraufgaben-Bausteine</h3>
                    <div id="subtask-template-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem;">
                        <!-- List of subtask templates -->
                    </div>
                    <div style="display: flex; gap: 10px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
                        <input type="text" id="new-subtask-template-title" class="glass-input" placeholder="Neue Unteraufgabe (z.B. Ölstand prüfen)" style="height: 50px;">
                        <button class="btn-primary compact" style="height: 50px; padding: 0 25px;" onclick="addSubtaskTemplate()">Hinzufügen</button>
                    </div>
                </div>
            </div>

            <div id="quicktemplates-tab-content" class="tab-content hidden">
                
                <div class="glass-card" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; color: #fff;">Gespeicherte Schnellvorlagen</h3>
                    <div id="quicktemplate-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px;">
                        <!-- List of quick templates as cards -->
                    </div>
                </div>
            </div>
        </section>
