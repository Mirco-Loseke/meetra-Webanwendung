        <!-- AI Settings View -->
        <section id="settings-ai" class="view hidden">
            <div class="users-header-container">
                <h1>KI-Konfiguration</h1>
                <div class="users-header-actions">
                    <button class="btn-back-custom" data-target="settings">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5"></path>
                            <path d="M12 19l-7-7 7-7"></path>
                        </svg>
                        ZURÜCK
                    </button>
                </div>
            </div>

            <div class="glass-card" style="max-width: 600px; margin-top: 2rem; padding: 2rem;">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label
                        style="color: rgba(255,255,255,0.7); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Groq
                        API-Key (Kostenlose KI)</label>
                    <div
                        style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 15px; line-height: 1.4;">
                        Wird verwendet für das extrem präzise und fehlerfreie Auslesen von Rechnungs-PDFs via
                        KI. Der Key wird <strong style="color:white;">nur lokal in deinem Browser</strong>
                        gespeichert.
                    </div>
                    <div style="position: relative;">
                        <input type="password" id="settings-api-key-new" class="glass-input" placeholder="gsk_..."
                            autocomplete="off" style="font-family: monospace; letter-spacing: 1px; width: 100%;">
                        <button type="button" onclick="toggleApiKeyVisibilityNew()"
                            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; transition: color 0.2s;"
                            onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">
                            <svg id="eye-icon-api-new" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div style="margin-top: 12px; font-size: 0.85rem;">
                        <a href="https://console.groq.com/keys" target="_blank"
                            style="color: #60a5fa; text-decoration: none; transition: color 0.2s;"
                            onmouseover="this.style.color='#93c5fd'" onmouseout="this.style.color='#60a5fa'">Hier kannst
                            du deinen API-Key erstellen
                            &rarr;</a>
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                    <button class="btn-primary" onclick="saveSettingsNew()">Einstellungen speichern</button>
                </div>
            </div>
        </section>
