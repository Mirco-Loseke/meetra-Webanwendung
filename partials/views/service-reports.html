                <!-- ========================================================= -->
                <!-- ================== SERVICEBERICHTE ====================== -->
                <!-- ========================================================= -->
                <section id="service" class="view hidden">
                    <div class="view-header-layout" style="margin-bottom: 2rem;">
                        <div class="view-header-row-top">
                            <div class="view-header-left">
                                <h1 style="margin: 0; display:flex; align-items:center; gap:12px;"><svg width="28"
                                        height="28" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                        <path
                                            d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
                                    </svg>Serviceberichte</h1>
                            </div>
                            <div class="view-header-right">
                                <!-- NEW Search Bar -->
                                <div class="custom-search-wrapper" style="width: 300px;">
                                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                    <input type="text" id="service-search-input" placeholder="Serviceberichte suchen..."
                                        autocomplete="off">
                                </div>
                            </div>
                        </div>
                        <div class="view-header-row-bottom">
                            <div class="view-header-left">
                                <div class="calendar-view-tabs" style="margin-bottom: 0;">
                                    <button class="calendar-tab-btn active" id="btn-service-tab-service"
                                        onclick="switchServicePage('service')">Serviceberichte</button>
                                    <button class="calendar-tab-btn" id="btn-service-tab-protocols"
                                        onclick="switchServicePage('protocols')">Protokolle</button>
                                </div>
                            </div>
                            <div class="view-header-right">
                                <!-- Service Category Filter -->
                                <div class="custom-filter-dropdown" id="service-category-filter-trigger">
                                    <span class="filter-label" id="service-current-category-name">Kategorien</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                    <div class="custom-filter-menu" id="service-category-filter-menu">
                                        <ul id="service-category-filter-options">
                                            <!-- Dynamically populated -->
                                        </ul>
                                    </div>
                                </div>

                                <button id="ai-analyze-service-entry-btn" class="btn-add-bg" type="button"
                                    onclick="window.openAiServiceReportModal()">
                                    <span>✨</span> KI analysieren
                                </button>

                                <button id="add-service-entry-btn" class="btn-add-bg"
                                    onclick="openServiceberichtModal()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        style="vertical-align: text-bottom; margin-right: 4px;">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Anlegen
                                </button>
                            </div>
                        </div>
                    </div>


                    <div id="service-entries-board-view">
                        <div id="service-entries-list" class="card-grid">
                            <!-- Service entry cards will be rendered here -->
                            <div class="empty-state"
                                style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; background: rgba(255,255,255,0.02); border-radius: 24px; border: 1px dashed rgba(255,255,255,0.1);">
                                <p style="color: rgba(255,255,255,0.4); font-size: 1.1rem;">Noch keine Serviceeinsätze
                                    angelegt.</p>
                            </div>
                        </div>
                    </div>
                </section>
