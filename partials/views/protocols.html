                <!-- ========================================================= -->
                <!-- ================== PROTOKOLLE =========================== -->
                <!-- ========================================================= -->
                <section id="protocols" class="view hidden">
                    <div class="view-header-layout">
                        <!-- Top Row: Title (Left) / Search (Right) -->
                        <div class="view-header-row-top">
                            <div class="view-header-left">
                                <h1 style="margin: 0; display:flex; align-items:center; gap:12px;"><svg width="28"
                                        height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path
                                            d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2">
                                        </path>
                                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                                        <path d="M9 12h6"></path>
                                        <path d="M9 16h6"></path>
                                        <path d="M9 8h6"></path>
                                    </svg>Protokolle</h1>
                            </div>
                            <div class="view-header-right">
                                <!-- Search Bar -->
                                <div class="search-wrapper" style="position: relative; width: 250px;">
                                    <input type="text" id="protocol-search-input" class="glass-search-input"
                                        placeholder="Protokolle suchen..."
                                        oninput="window.handleProtocolSearch(this.value)"
                                        style="padding-left: 3rem; width: 100%; box-sizing: border-box;">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                        style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.6;">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Row: Tabs (Left) / Filters (Right) -->
                        <div class="view-header-row-bottom">
                            <div class="view-header-left" style="display: flex; align-items: center; gap: 16px;">
                                <div class="calendar-view-tabs" style="margin-bottom: 0;">
                                    <button class="calendar-tab-btn" id="btn-protocol-tab-service"
                                        onclick="switchServicePage('service')">Serviceberichte</button>
                                    <button class="calendar-tab-btn active" id="btn-protocol-tab-protocols"
                                        onclick="switchServicePage('protocols')">Protokolle</button>
                                </div>
                                <div class="calendar-view-tabs" style="margin-bottom: 0;">
                                    <button class="calendar-tab-btn active" id="btn-protocol-view-board"
                                        onclick="window.switchProtocolView('board')">Board</button>
                                    <button class="calendar-tab-btn" id="btn-protocol-view-list"
                                        onclick="window.switchProtocolView('list')">Liste</button>
                                </div>
                            </div>
                            <div class="view-header-right" style="gap: 16px;">
                                <!-- Filter Group -->
                                <div class="calendar-view-tabs" style="margin-bottom: 0;">
                                    <button onclick="window.setProtocolFilter('all')" class="calendar-tab-btn active"
                                        id="filter-all">Alle</button>
                                    <button onclick="window.setProtocolFilter('intake')" class="calendar-tab-btn"
                                        id="filter-intake">Eingang</button>
                                    <button onclick="window.setProtocolFilter('acceptance')" class="calendar-tab-btn"
                                        id="filter-acceptance">Abnahme</button>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div id="protocol-board-view">
                        <!-- Protocol List -->
                        <div id="protocol-list-container" class="card-grid">
                            <!-- Protocol cards will be rendered here -->
                            <div class="empty-state"
                                style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; background: rgba(255,255,255,0.02); border-radius: 24px; border: 1px dashed rgba(255,255,255,0.1);">
                                <p style="color: rgba(255,255,255,0.4); font-size: 1.1rem;">Lade Protokolle...</p>
                            </div>
                        </div>
                    </div>

                    <div id="protocol-list-view" class="hidden">
                        <div class="glass-card"
                            style="padding: 0.75rem; background: transparent; border: none; box-shadow: none;">
                            <table class="task-table" style="border-collapse: separate; border-spacing: 0 10px;">
                                <thead>
                                    <tr>
                                        <th style="min-width: 200px;">Maschine</th>
                                        <th>Datum</th>
                                        <th>Typ</th>
                                        <th>Status</th>
                                        <th style="text-align: right;">Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody id="protocol-table-body">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
