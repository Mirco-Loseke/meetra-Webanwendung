<section id="accounting" class="view hidden">
    <div class="view-header-layout">
        <div class="view-header-row-top" style="flex-direction: column; gap: 12px; align-items: stretch;">
            <!-- Row 1: Title + Action Button (PC) / Icon (Mobile) -->
            <div class="acc-header-row-1"
                style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="view-header-left">
                    <h1 style="margin: 0; display:flex; align-items:center; gap:12px; font-size: 1.5rem;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z">
                            </path>
                            <path d="M16 8h-6"></path>
                            <path d="M16 12h-9"></path>
                            <path d="M15 16h-8"></path>
                        </svg>
                        Buchhaltung
                    </h1>
                </div>
                <!-- Action Button and Year Filter (Desktop Group) -->
                <div class="acc-desktop-header-actions acc-desktop-only"
                    style="display: flex; align-items: center; gap: 16px;">
                    <div id="acc-year-dropdown-desktop" class="acc-year-dropdown-container"
                        style="position: relative; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; user-select: none; min-width: 120px;"
                        onclick="window.toggleYearDropdown(event, 'acc-year-list-desktop')">
                        <span
                            style="color:#fff; font-size: 0.8rem; font-weight: 600; white-space: nowrap;">Jahr:</span>
                        <span class="acc-year-display-label"
                            style="color: #fff; font-size: 0.95rem; font-weight: 700;">—</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                        <div id="acc-year-list-desktop" class="acc-year-list-shared hidden"
                            style="position: absolute; top: calc(100% + 6px); left: 0; min-width: 140px; background: rgba(20,20,28,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; z-index: 9999;">
                        </div>
                    </div>
                    <button onclick="openAccountingModal()" class="btn-primary knopf--klein"
                        style="display: flex; align-items: center; gap: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Neuer Eintrag
                    </button>
                </div>
            </div>

            <!-- Row 2: Year Filter + Overview Icons -->
            <div class="view-header-right" style="width: 100%; padding: 0;">
                <div class="acc-mobile-header-group"
                    style="display: flex; align-items: center; gap: 10px; width: 100%;">
                    <div class="acc-mobile-only" id="acc-year-dropdown-mobile"
                        style="position: relative; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); flex: 1; cursor: pointer; user-select: none;"
                        onclick="window.toggleYearDropdown(event, 'acc-year-list-mobile')">
                        <span
                            style="color:#fff; font-size: 0.8rem; font-weight: 600; white-space: nowrap;">Jahr:</span>
                        <span class="acc-year-display-label"
                            style="color: #fff; font-size: 0.95rem; font-weight: 700;">—</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                        <div id="acc-year-list-mobile" class="acc-year-list-shared hidden"
                            style="position: absolute; top: calc(100% + 6px); left: 0; min-width: 140px; background: rgba(20,20,28,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; z-index: 9999;">
                        </div>
                    </div>
                    <div class="acc-desktop-only" style="flex: 1; display: flex; align-items: center;">
                        <div class="calendar-view-tabs"
                            style="margin-bottom: 0; background: transparent; padding: 0; border: none; box-shadow: none;">
                            <button class="calendar-tab-btn active" id="tab-incoming-desktop"
                                onclick="switchAccountingTab('incoming')"
                                style="padding: 10px 20px; border-radius: 12px; font-weight: 700;">Eingangsrechnungen</button>
                            <button class="calendar-tab-btn" id="tab-outgoing-desktop"
                                onclick="switchAccountingTab('outgoing')"
                                style="padding: 10px 20px; border-radius: 12px; font-weight: 700;">Ausgangsrechnungen</button>
                        </div>
                    </div>
                    <button onclick="window.openFinancialDashboard()" class="btn-icon-soft"
                        style="height: 44px; width: 44px; padding: 0; flex: 0 0 44px;" title="Finanzübersicht">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                            <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                        </svg>
                    </button>
                    <button onclick="window.openMachineEvaluation()" class="btn-icon-soft"
                        style="height: 44px; width: 44px; padding: 0; flex: 0 0 44px;" title="Kostenauswertung">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                            <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                            <path d="M12 12L16 16"></path>
                            <path d="M12 12l4-4"></path>
                            <path d="M12 12l-4 4"></path>
                            <path d="M12 12l-4-4"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Row 3: Full-Width Action Button (Mobile) -->
            <div class="acc-mobile-only" style="width: 100%;">
                <button onclick="openAccountingModal()" class="btn-primary"
                    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Neuer Eintrag
                </button>
            </div>
        </div>

        <!-- Machine Evaluation Modal -->
        <div id="machine-evaluation-modal" class="modal-backdrop hidden">
            <div class="modal-content" style="max-width: 1000px; max-height: 90vh; overflow-y: auto;">
                <div class="modal-header"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; display: flex; align-items: center; gap: 12px; font-size: 1.5rem;">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="21" x2="9" y2="9"></line>
                        </svg>
                        Kostenauswertung
                    </h2>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <select id="eval-time-range" class="glass-form-input"
                            style="padding: 4px 10px; width: 150px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem;"
                            onchange="window.updateMachineEvaluation()">
                            <option value="current_month">Aktueller Monat</option>
                            <option value="last_2_months">Letzte 2 Monate</option>
                            <option value="last_3_months" selected>Letzte 3 Monate</option>
                            <option value="current_year">Aktuelles Jahr</option>
                            <option value="last_year">Letztes Jahr</option>
                        </select>
                        <button onclick="window.closeMachineEvaluation()" class="btn-icon-soft"
                            style="color: #ef4444; padding: 5px;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="3">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="machine-evaluation-content">
                    <!-- Dynamic Content via JS -->
                </div>
            </div>
        </div>

        <div class="view-header-row-bottom acc-mobile-only">
            <div class="view-header-left">
                <div class="calendar-view-tabs" style="margin-bottom: 0;">
                    <button class="calendar-tab-btn active" id="tab-incoming"
                        onclick="switchAccountingTab('incoming')">Eingangsrechnungen</button>
                    <button class="calendar-tab-btn" id="tab-outgoing"
                        onclick="switchAccountingTab('outgoing')">Ausgangsrechnungen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Accounting KPIs (Zusammenfassung) -->
    <div id="accounting-kpi-container" style="margin-top: 2rem;"></div>

    <div id="accounting-table-container" class="glass-card"
        style="padding: 0; overflow-x: auto; margin-top: 2rem;">
        <!-- Dynamic Table Content -->
    </div>

    <!-- Accounting Charts Row -->
    <div class="ang-charts-row" id="accounting-charts-row" style="margin-top: 3rem;"></div>

    <div id="accounting-quarters" style="margin-top: 3rem;">
        <div style="margin-bottom: 1.5rem;">
            <h2 style="color: #fff; margin: 0;">Quartals-Auswertung</h2>
        </div>
        <div id="quarters-grid">
            <!-- Quarters will be rendered here -->
        </div>
    </div>

    <!-- YoY Comparison Section -->
    <div id="accounting-yoy" style="margin-top: 3rem; margin-bottom: 2rem;">
        <div style="margin-bottom: 1.5rem;">
            <h2 style="color: #fff; margin: 0;">Vorjahres-Vergleich (YoY)</h2>
        </div>
        <div id="accounting-yoy-grid"></div>
    </div>
</section>
