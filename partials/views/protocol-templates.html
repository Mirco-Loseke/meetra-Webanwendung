<section id="protocol-templates" class="view hidden">
    <div class="users-header-container">
        <h1>Protokollvorlagen</h1>
        <div class="users-header-actions">
            <button class="btn-back-custom" data-target="settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                ZURÜCK
            </button>
        </div>
    </div>
    <div id="protocol-templates-list" class="card-grid" style="margin-top: 2rem;">
        <!-- Templates will be rendered here -->
    </div>
</section>

<!-- Protocol Template Editor View -->
<section id="protocol-template-editor" class="view hidden">
    <div class="users-header-container">
        <h1 id="editor-template-name">Vorlage bearbeiten</h1>
        <div class="users-header-actions" style="display: flex; align-items: center; gap: 1rem;">
            <button class="btn-back-custom" data-target="protocol-templates">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                ZURÜCK
            </button>
            <div class="category-select-wrapper"
                style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                <span
                    style="font-size: 0.8rem; color: rgba(255,255,255,0.4); font-weight: 600;">KATEGORIE:</span>
                <select id="template-category-select"
                    style="background: transparent; border: none; color: #fff; font-size: 0.85rem; font-weight: 700; outline: none; cursor: pointer; min-width: 150px;">
                    <option value="">Keine Kategorien geladen</option>
                </select>
            </div>
            <button id="save-template-btn" class="btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                SPEICHERN
            </button>
        </div>
    </div>

    <div id="template-editor-container" style="margin-top: 2rem; max-width: 1000px;">
        <!-- Editor content will be rendered here -->
    </div>

    <div style="margin-top: 2rem; display: flex; justify-content: center;">
        <button class="btn-secondary" onclick="addTemplateGroup()"
           >
            + NEUE GRUPPE HINZUFÜGEN
        </button>
    </div>
</section>
