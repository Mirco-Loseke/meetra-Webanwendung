                <!-- ========================================================= -->
                <!-- ================== ADRESSBUCH ========================= -->
                <!-- ========================================================= -->
                <section id="addressbook" class="view hidden">
                    <div class="view-header-layout">
                        <div class="view-header-row-top">
                            <div class="view-header-left">
                                <h1 style="margin: 0; display:flex; align-items:center; gap:12px;">
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path
                                            d="M19 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1z" />
                                        <line x1="3" y1="8" x2="6" y2="8" />
                                        <line x1="3" y1="12" x2="6" y2="12" />
                                        <line x1="3" y1="16" x2="6" y2="16" />
                                        <circle cx="13" cy="10" r="2.5" />
                                        <path d="M9.5 16.5a3.5 3.5 0 0 1 7 0" />
                                    </svg>Adressbuch
                                </h1>
                            </div>
                            <div class="view-header-right">
                                <div class="custom-search-wrapper" style="width: 280px;">
                                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                    <input type="text" id="addressbook-search"
                                        placeholder="Firma, Ort, Kundennr., E-Mail …" autocomplete="off">
                                </div>
                            </div>
                        </div>
                        <div class="view-header-row-bottom">
                            <div class="view-header-left">
                                <span class="ab-count" id="addressbook-count"></span>
                            </div>
                            <div class="view-header-right ab-toolbar">
                                <!-- Adressart Filter -->
                                <div class="custom-filter-dropdown" id="ab-kind-filter-trigger">
                                    <span class="filter-label" id="ab-current-kind-name">Alle Adressen</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>

                                    <div class="custom-filter-menu" id="ab-kind-filter-menu">
                                        <ul id="ab-kind-filter-options">
                                            <!-- Dynamisch befüllt -->
                                        </ul>
                                    </div>
                                </div>


                                <!-- Addressbook Address Type Filter -->
                                <div class="custom-filter-dropdown" id="ab-address-type-filter-trigger">
                                    <span class="filter-label" id="ab-current-address-type-name">Adresstyp</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>

                                    <div class="custom-filter-menu" id="ab-address-type-filter-menu">
                                        <ul id="ab-address-type-filter-options">
                                            <!-- Dynamically populated -->
                                        </ul>
                                    </div>
                                </div>

                                <!-- Land Filter (kompakt, viele Einträge) -->
                                <div class="custom-filter-dropdown filter-compact" id="ab-country-filter-trigger">
                                    <span class="filter-label" id="ab-current-country-name">Alle Länder</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>

                                    <div class="custom-filter-menu" id="ab-country-filter-menu">
                                        <ul id="ab-country-filter-options">
                                            <!-- Dynamisch befüllt -->
                                        </ul>
                                    </div>
                                </div>

                                <!-- Sortierung -->
                                <div class="custom-filter-dropdown" id="ab-sort-filter-trigger">
                                    <span class="filter-label" id="ab-current-sort-name">Name A–Z</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>

                                    <div class="custom-filter-menu" id="ab-sort-filter-menu">
                                        <ul id="ab-sort-filter-options">
                                            <!-- Dynamisch befüllt -->
                                        </ul>
                                    </div>
                                </div>

                                <!-- Verlauf: zuletzt geöffnete/bearbeitete Adressen (js/address-history.js) -->
                                <button class="ab-history-btn" data-abh-action="history"
                                    title="Zuletzt geöffnete und bearbeitete Adressen">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 3v5h5" />
                                        <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" />
                                        <path d="M12 7v5l4 2" />
                                    </svg>
                                    Verlauf
                                </button>

                                <button class="ab-select-toggle" id="addressbook-select-btn"
                                    data-ab-action="select-mode"
                                    title="Adressen der Reihe nach auswählen und als Route öffnen">
                                    Route zusammenstellen
                                </button>

                                <button class="btn-add-bg" data-ab-action="new">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        style="vertical-align: text-bottom; margin-right: 4px;">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Adresse hinzufügen
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="addressbook-list">
                        <!-- Adress-Visitenkarten werden dynamisch geladen -->
                    </div>
                </section>
