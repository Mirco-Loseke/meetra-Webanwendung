                <!-- ================== MASCHINEN ============================ -->
                <!-- ========================================================= -->
                <section id="machines" class="view hidden">
                    <div class="view-header-layout">
                        <div class="view-header-row-top">
                            <div class="view-header-left">
                                <h1 style="margin: 0; display:flex; align-items:center; gap:12px;"><svg width="28"
                                        height="28" viewBox="0 0 100 100" fill="none" stroke="currentColor"
                                        stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="38" y="30" width="28" height="22" rx="3" />
                                        <line x1="62" y1="34" x2="88" y2="18" />
                                        <line x1="88" y1="18" x2="92" y2="46" />
                                        <path d="M92 46 L80 56 L72 50 L84 40 Z" />
                                        <rect x="20" y="54" width="58" height="14" rx="4" />
                                        <rect x="14" y="63" width="70" height="10" rx="5" />
                                        <circle cx="22" cy="68" r="7" />
                                        <circle cx="76" cy="68" r="7" />
                                        <circle cx="49" cy="68" r="5" />
                                    </svg>Maschinen</h1>
                            </div>
                            <div class="view-header-right">
                                <!-- Machine Search Field -->
                                <div class="custom-search-wrapper" style="width: 250px;">
                                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                    <input type="text" id="machine-search-input" placeholder="Suchen..."
                                        autocomplete="off">
                                </div>
                            </div>
                        </div>
                        <div class="view-header-row-bottom">
                            <div class="view-header-left"></div>
                            <div class="view-header-right">
                                <!-- Machine Category Filter -->
                                <div class="custom-filter-dropdown" id="machine-category-filter-trigger">
                                    <span class="filter-label" id="current-category-name">Maschinenkategorien</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>

                                    <div class="custom-filter-menu" id="machine-category-filter-menu">
                                        <ul id="machine-category-filter-options">
                                            <!-- Dynamically populated -->
                                        </ul>
                                    </div>
                                </div>

                                <!-- Machine Series Filter -->
                                <div class="custom-filter-dropdown" id="machine-series-filter-trigger">
                                    <span class="filter-label" id="current-series-filter-name">Maschinenserie</span>
                                    <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>

                                    <div class="custom-filter-menu" id="machine-series-filter-menu">
                                        <ul id="machine-series-filter-options">
                                            <!-- Dynamically populated -->
                                        </ul>
                                    </div>
                                </div>

                                <!-- Workshop Gear Filter Button -->
                                <button id="btn-filter-workshop" class="btn-workshop-filter" onclick="window.toggleWorkshopFilter()" title="In der Werkstatt filtern">
                                    <svg width="22" height="22" viewBox="-10 -10 120 120" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M43 8h14l3 11a31 31 0 0 1 9 4l10-5 10 10-5 10a31 31 0 0 1 4 9l11 3v14l-11 3a31 31 0 0 1-4 9l5 10-10 10-10-5a31 31 0 0 1-9 4l-3 11H43l-3-11a31 31 0 0 1-9-4l-10 5-10-10 5-10a31 31 0 0 1-4-9L1 57V43l11-3a31 31 0 0 1 4-9L11 21l10-10 10 5a31 31 0 0 1 9-4Z" />
                                        <circle cx="50" cy="50" r="22" />
                                        <path d="M38 34a12 12 0 0 1 12 12 12 12 0 0 1-2.5 7.5L60 66a3 3 0 0 1 0 4.2 3 3 0 0 1-4.2 0L43.5 57.5A12 12 0 0 1 38 58a12 12 0 0 1-12-12 12 12 0 0 1 6-10.4l5.5 5.5 3.4-3.4-5.5-5.5A12 12 0 0 1 38 34z" />
                                    </svg>
                                </button>

                                <button id="add-machine-btn" class="btn-add-bg" onclick="openAddMachineModal()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                        style="vertical-align: text-bottom; margin-right: 4px;">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Maschine hinzufügen
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="machine-list-container">
                        <!-- Machine cards will be loaded here dynamically -->
                    </div>
                </section>
